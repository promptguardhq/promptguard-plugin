name: Announce release

# A plugin Release is cut by hand (`gh release create vX.Y.Z` with the
# CHANGELOG section as its notes): agents install the plugin from this
# repository, so there is nothing to build or upload. This only tells Slack
# #releases that one was published (ADR-0038 in the platform repo).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # It cannot fail the release: the job is continue-on-error and
  # post-release.sh exits 0 on every failure, with a warning (an unset
  # SLACK_RELEASES_WEBHOOK_URL included).
  announce:
    name: Announce in #releases
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Workload Identity, to read the webhook
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts
      # Secret Manager is the only store; GitHub holds no secrets. This repo
      # reads as itself (direct Workload Identity Federation, no service account).
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
      - name: Read secrets from Secret Manager
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            SLACK_RELEASES_WEBHOOK_URL:promptguard-production-472014/SLACK_RELEASES_WEBHOOK_URL
      - name: Post to #releases
        env:
          SLACK_RELEASES_WEBHOOK_URL: ${{ steps.secrets.outputs.SLACK_RELEASES_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES_URL: ${{ github.event.release.html_url }}
        run: scripts/post-release.sh "Plugin" "$TAG" "$NOTES_URL"
